<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF Advisor · 智能投资助手</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0e14;
  --bg-card: #131820;
  --bg-elevated: #1a1f2e;
  --border: #1e2a3a;
  --text: #c8ccd4;
  --text-dim: #6b7280;
  --text-bright: #e8ecf2;
  --accent: #00d4aa;
  --accent2: #3b82f6;
  --up: #00d4aa;
  --down: #ef4444;
  --warn: #f59e0b;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh; line-height: 1.6;
}

/* Header */
.header {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; height: 60px;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
}
.header .logo { font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items:center; gap:8px; }
.header .logo span { font-size: 13px; color: var(--text-dim); font-weight: 400; }
.header .status { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-dim); }
.header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Nav */
.nav {
  display: flex; gap: 2px; padding: 0 24px; background: var(--bg-card);
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.nav button {
  background: none; border: none; color: var(--text-dim); padding: 12px 20px;
  font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all .2s;
}
.nav button:hover { color: var(--text); }
.nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Main */
.main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.section { display: none; }
.section.active { display: block; }

/* Cards */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }

.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card h3 { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.card .price { font-size: 28px; font-weight: 700; color: var(--text-bright); }
.card .change { font-size: 14px; margin-top: 4px; }
.card .up { color: var(--up); }
.card .down { color: var(--down); }
.card .sub { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

/* ETF Card */
.etf-card { cursor: pointer; transition: transform .2s, border-color .2s; }
.etf-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.etf-card .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.etf-card .tags span { 
  font-size: 11px; padding: 2px 8px; border-radius: 12px;
  background: rgba(0,212,170,.1); color: var(--accent); border: 1px solid rgba(0,212,170,.2);
}
.etf-card .tags span.type { background: rgba(59,130,246,.1); color: var(--accent2); border-color: rgba(59,130,246,.2); }

/* Insight */
.insight {
  padding: 12px 16px; border-radius: 8px; margin-bottom: 8px;
  border-left: 3px solid; font-size: 14px;
}
.insight.bullish, .insight.positive { background: rgba(0,212,170,.05); border-color: var(--up); }
.insight.bearish, .insight.warning { background: rgba(239,68,68,.05); border-color: var(--down); }
.insight.neutral { background: rgba(107,114,128,.05); border-color: var(--text-dim); }
.insight.opportunity { background: rgba(59,130,246,.05); border-color: var(--accent2); }
.insight.correction { background: rgba(245,158,11,.05); border-color: var(--warn); }
.insight .cat { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

/* Chart */
.chart-wrap { position: relative; height: 300px; margin: 8px 0; }
.chart-wrap canvas { width: 100% !important; }

/* News */
.news-item { 
  padding: 14px 0; border-bottom: 1px solid var(--border);
  transition: background .2s;
}
.news-item:hover { background: rgba(255,255,255,.02); padding-left: 12px; margin-left: -12px; border-radius: 6px; }
.news-item a { color: var(--text); text-decoration: none; font-size: 14px; }
.news-item a:hover { color: var(--accent); }
.news-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; display: flex; gap: 12px; }

/* Portfolio */
.portfolio-summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-elevated); border-radius: var(--radius); padding: 16px; text-align: center;
}
.stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.stat-card .value { font-size: 22px; font-weight: 700; color: var(--text-bright); }
.stat-card .subval { font-size: 13px; margin-top: 2px; }

/* Advice */
.advice-box {
  background: rgba(0,212,170,.03); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
}
.advice-box .level { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
.advice-box .summary { font-size: 16px; font-weight: 600; color: var(--text-bright); margin-bottom: 12px; }
.advice-box .actions { margin-top: 12px; }

/* Market status badges */
.badge { 
  display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
}
.badge.bullish { background: rgba(0,212,170,.15); color: var(--up); }
.badge.bearish { background: rgba(239,68,68,.15); color: var(--down); }
.badge.neutral { background: rgba(107,114,128,.15); color: var(--text-dim); }

/* Risk */
.risk-low { color: var(--up); }
.risk-mid { color: var(--warn); }
.risk-high { color: var(--down); }

/* Responsive */
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .header { padding: 0 12px; }
  .nav { padding: 0 12px; }
  .main { padding: 12px; }
}

/* Loading */
.loading { text-align:center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }
.loading .spinner { 
  display: inline-block; width: 30px; height: 30px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer { 
  text-align: center; padding: 40px 24px; color: var(--text-dim); font-size: 12px;
  border-top: 1px solid var(--border); margin-top: 40px;
}

/* Action list */
.action-item {
  background: var(--bg-elevated); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.action-item .act-icon { font-size: 20px; }
.action-item .act-info { flex: 1; }
.action-item .act-info .act-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
.action-item .act-info .act-reason { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.action-item .act-badge { 
  font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 600;
}
.act-badge.buy { background: rgba(0,212,170,.1); color: var(--up); }
.act-badge.hold { background: rgba(107,114,128,.1); color: var(--text-dim); }
.act-badge.wait { background: rgba(59,130,246,.1); color: var(--accent2); }
.act-badge.sell { background: rgba(239,68,68,.1); color: var(--down); }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    📊 ETF Advisor
    <span>智能投资助手</span>
  </div>
  <div class="status">
    <span id="updateTime">加载中...</span>
    <span class="dot"></span>
  </div>
</header>

<nav class="nav" id="nav">
  <button data-section="dashboard" class="active">🏠 大盘看板</button>
  <button data-section="etfs">📊 ETF详情</button>
  <button data-section="portfolio">💰 投资组合</button>
  <button data-section="news">📰 财经资讯</button>
  <button data-section="advice">💡 投资建议</button>
</nav>

<main class="main">

<!-- ========== DASHBOARD ========== -->
<section class="section active" id="dashboard">
  <div id="dashboard-loading" class="loading"><div class="spinner"></div><br>加载大盘数据...</div>
  <div id="dashboard-content" style="display:none;">
    <div class="grid-4" id="index-cards"></div>
    <h3 style="color:var(--text-dim);font-size:13px;margin-bottom:12px;">📊 关注ETF · 实时概览</h3>
    <div class="grid-3" id="etf-cards"></div>
    <h3 style="color:var(--text-dim);font-size:13px;margin:24px 0 12px;">💡 今日洞察</h3>
    <div id="insight-list"></div>
  </div>
</section>

<!-- ========== ETF DETAIL ========== -->
<section class="section" id="etfs">
  <div id="etfs-loading" class="loading"><div class="spinner"></div><br>加载ETF详情...</div>
  <div id="etfs-content" style="display:none;">
    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;" id="etf-tabs"></div>
    <div id="etf-detail"></div>
  </div>
</section>

<!-- ========== PORTFOLIO ========== -->
<section class="section" id="portfolio">
  <div id="portfolio-loading" class="loading"><div class="spinner"></div><br>加载投资组合...</div>
  <div id="portfolio-content" style="display:none;">
    <h2 style="margin-bottom:16px;">💰 模拟投资组合</h2>
    <p style="color:var(--text-dim);margin-bottom:16px;">起始资金 ¥100,000 · 起始日期 <span id="simStarted"></span></p>
    <div class="portfolio-summary" id="sim-summary"></div>

    <div class="grid-2">
      <div class="card">
        <h3>📈 组合净值走势</h3>
        <div class="chart-wrap"><canvas id="simChart"></canvas></div>
      </div>
      <div class="card">
        <h3>📋 持仓明细</h3>
        <div id="holdings-list" style="margin-top:12px;"></div>
      </div>
    </div>

    <h3 style="margin-top:24px;margin-bottom:12px;color:var(--text-dim);">📝 交易记录</h3>
    <div id="trades-list"></div>

    <h3 style="margin-top:24px;margin-bottom:12px;color:var(--text-dim);">🔧 自我纠偏记录</h3>
    <div id="corrections-list"></div>
  </div>
</section>

<!-- ========== NEWS ========== -->
<section class="section" id="news">
  <div id="news-loading" class="loading"><div class="spinner"></div><br>加载财经资讯...</div>
  <div id="news-content" style="display:none;">
    <h2 style="margin-bottom:20px;">📰 财经资讯</h2>
    <div id="news-list"></div>
  </div>
</section>

<!-- ========== ADVICE ========== -->
<section class="section" id="advice">
  <div id="advice-loading" class="loading"><div class="spinner"></div><br>加载投资建议...</div>
  <div id="advice-content" style="display:none;">
    <h2 style="margin-bottom:20px;">💡 今日投资建议</h2>
    <div id="advice-main"></div>
  </div>
</section>

</main>

<footer class="footer">
  ETF Advisor v1.0 · 数据来源：东方财富 · 新浪财经 · 更新时间 <span id="footerTime">--</span>
  <br>⚠️ 本站内容仅供学习参考，不构成投资建议。投资有风险，入市需谨慎。
</footer>

<script>
// ===== 数据加载 =====
let G = { etfs: null, indices: null, news: null, sim: null, meta: null, insights: null, advice: null, history: null, charts: {} };

const DEMO = false; // 设为 true 使用演示数据

async function loadData() {
  const base = '../data/';
  try {
    const [etfRes, idxRes, newsRes, simRes, metaRes, insRes, advRes, histRes] = await Promise.all([
      fetch(base + 'etf-data.json'), fetch(base + 'indices.json'), fetch(base + 'news.json'),
      fetch(base + 'simulated-portfolio.json'), fetch(base + 'meta.json'),
      fetch(base + 'insights.json'), fetch(base + 'advice.json'), fetch(base + 'history.json')
    ]);
    G.etfs = await etfRes.json(); G.indices = await idxRes.json(); G.news = await newsRes.json();
    G.sim = await simRes.json(); G.meta = await metaRes.json();
    G.insights = await insRes.json(); G.advice = await advRes.json(); G.history = await histRes.json();
    return true;
  } catch(e) {
    console.error('数据加载失败:', e);
    return false;
  }
}

// ===== 格式化 =====
function fmt(n,d=2) { return Number(n||0).toFixed(d); }
function pct(n) { n=Number(n||0); return (n>=0?'+':'')+fmt(n,2)+'%'; }
function colorNum(n) { n=Number(n||0); return n>=0?'up':'down'; }
function timeAgo(t) { 
  if(!t) return '';
  const d = new Date(t); if(isNaN(d)) return t.slice(0,16);
  return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ===== 导航 =====
document.getElementById('nav').addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(e.target.dataset.section).classList.add('active');
  // 按需渲染
  const sec = e.target.dataset.section;
  if(sec === 'etfs' && !document.getElementById('etfs-content').style.display) renderETFs();
  if(sec === 'portfolio' && !document.getElementById('portfolio-content').style.display) renderPortfolio();
  if(sec === 'news' && !document.getElementById('news-content').style.display) renderNews();
  if(sec === 'advice' && !document.getElementById('advice-content').style.display) renderAdvice();
});

// ===== 大盘看板 =====
function renderDashboard() {
  if(!G.etfs || !G.indices) return;
  document.getElementById('dashboard-loading').style.display = 'none';
  document.getElementById('dashboard-content').style.display = 'block';
  document.getElementById('updateTime').textContent = '更新 ' + timeAgo(G.meta?.lastUpdate);
  document.getElementById('footerTime').textContent = timeAgo(G.meta?.lastUpdate);

  // 指数卡片
  const idxC = document.getElementById('index-cards');
  idxC.innerHTML = G.indices.filter(i=>i).map(i => `
    <div class="card">
      <h3>${i.name}</h3>
      <div class="price">${fmt(i.price, 2)}</div>
      <div class="change ${colorNum(i.changePct)}">${pct(i.changePct)} ${Number(i.change)>=0?'▲':'▼'}</div>
      ${i.high ? `<div class="sub">最高 ${fmt(i.high,2)} / 最低 ${fmt(i.low,2)}</div>` : ''}
    </div>
  `).join('');

  // ETF 卡片
  const etfC = document.getElementById('etf-cards');
  etfC.innerHTML = G.etfs.map(e => `
    <div class="card etf-card" onclick="switchETF('${e.code}')">
      <h3>${e.name} <span style="color:var(--text-dim);font-weight:400;">${e.code}</span></h3>
      <div class="price">${e.nav ? fmt(e.nav,4) : '--'}</div>
      <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;">
        ${e.returns ? Object.entries(e.returns).map(([k,v]) => 
          `<div><span style="font-size:11px;color:var(--text-dim)">${k}</span> <span class="${colorNum(v)}" style="font-size:13px;font-weight:600;">${pct(v)}</span></div>`
        ).join('') : ''}
      </div>
      <div class="tags">
        <span class="type">${e.type}</span>
        ${(e.tags||[]).slice(0,3).map(t => `<span>${t}</span>`).join('')}
        ${e.drawdownFromHigh ? `<span style="background:rgba(239,68,68,.1);color:var(--down);">回撤${Math.abs(e.drawdownFromHigh)}%</span>` : ''}
      </div>
    </div>
  `).join('');

  // 洞察
  if(G.insights && G.insights.insights) {
    document.getElementById('insight-list').innerHTML = G.insights.insights.map(i => `
      <div class="insight ${i.level}">
        <div class="cat">${i.cat}</div>
        <div>${i.text}</div>
      </div>
    `).join('');
  }
}

// ===== ETF 详情 =====
let activeETF = null;
function switchETF(code) {
  activeETF = code;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  document.querySelector('#nav button[data-section="etfs"]').classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('etfs').classList.add('active');
  renderETFDetail();
}

function renderETFs() {
  if(!G.etfs) return;
  document.getElementById('etfs-loading').style.display = 'none';
  document.getElementById('etfs-content').style.display = 'block';
  
  // ETF 标签
  const tabs = document.getElementById('etf-tabs');
  tabs.innerHTML = G.etfs.map(e => `
    <button style="padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:${activeETF===e.code?'var(--bg-elevated)':'var(--bg-card)'};color:${activeETF===e.code?'var(--accent)':'var(--text)'};cursor:pointer;font-size:13px;"
      onclick="activeETF='${e.code}';renderETFDetail();document.querySelectorAll('#etf-tabs button').forEach(b=>{b.style.background='var(--bg-card)';b.style.color='var(--text)';});this.style.background='var(--bg-elevated)';this.style.color='var(--accent)';">
      ${e.name}
    </button>
  `).join('');
  if(!activeETF) activeETF = G.etfs[0]?.code;
  renderETFDetail();
}

function renderETFDetail() {
  const e = G.etfs.find(x => x.code === activeETF);
  if(!e) return;
  const detail = document.getElementById('etf-detail');
  
  let returnsHtml = e.returns ? Object.entries(e.returns).map(([k,v]) => 
    `<div class="stat-card">
      <div class="label">近${k}</div>
      <div class="value ${colorNum(v)}">${pct(v)}</div>
    </div>`
  ).join('') : '';

  detail.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <h3>${e.name} · ${e.code}</h3>
      <div style="display:flex;gap:24px;margin-top:12px;flex-wrap:wrap;">
        <div><div class="price">${e.nav ? fmt(e.nav, 4) : '--'}</div><div class="sub">最新净值</div></div>
        ${e.drawdownFromHigh ? `<div><span style="font-size:24px;font-weight:700;color:var(--down)">-${Math.abs(e.drawdownFromHigh)}%</span><div class="sub">从年内高点回撤</div></div>` : ''}
        ${e.volatility30d ? `<div><span style="font-size:24px;font-weight:700;color:var(--warn)">${e.volatility30d}%</span><div class="sub">30日波动率</div></div>` : ''}
      </div>
    </div>
    <div class="portfolio-summary">${returnsHtml}</div>
    <div class="card">
      <h3>📈 净值走势（近180天）</h3>
      <div class="chart-wrap"><canvas id="etfChart"></canvas></div>
    </div>
  `;

  // Chart
  if(e.trends && e.trends.length > 0) {
    const ctx = document.getElementById('etfChart');
    if(G.charts.etfChart) G.charts.etfChart.destroy();
    const labels = e.trends.map(t => new Date(t.x).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}));
    const data = e.trends.map(t => t.y);
    const upColor = data[data.length-1] >= data[0] ? '#00d4aa' : '#ef4444';
    G.charts.etfChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [{ label: '净值', data, borderColor: upColor, borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: upColor + '10', tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 12, color: '#6b7280' }, grid: { color: '#1e2a3a' } }, y: { ticks: { color: '#6b7280' }, grid: { color: '#1e2a3a' } } } }
    });
  }
}

// ===== 投资组合 =====
function renderPortfolio() {
  if(!G.sim) return;
  document.getElementById('portfolio-loading').style.display = 'none';
  document.getElementById('portfolio-content').style.display = 'block';
  document.getElementById('simStarted').textContent = G.sim.startedAt || '--';

  // 计算当前价值
  let hv = 0;
  for(const h of (G.sim.holdings||[])) {
    const etf = G.etfs?.find(e => e.code === h.etf);
    if(etf) hv += h.shares * etf.nav;
  }
  const tv = G.sim.cash + hv;
  const totalCost = (G.sim.holdings||[]).reduce((s,h)=>s+h.shares*h.cost,0);
  const pnl = hv - totalCost;
  const pnlPct = totalCost > 0 ? (pnl/totalCost*100) : 0;

  document.getElementById('sim-summary').innerHTML = `
    <div class="stat-card"><div class="label">💰 总资产</div><div class="value">¥${fmt(tv,2)}</div></div>
    <div class="stat-card"><div class="label">💵 现金</div><div class="value">¥${fmt(G.sim.cash,2)}</div></div>
    <div class="stat-card"><div class="label">📦 持仓市值</div><div class="value">¥${fmt(hv,2)}</div></div>
    <div class="stat-card"><div class="label">📊 累计盈亏</div><div class="value ${colorNum(pnl)}">${pct(pnl)}</div><div class="subval">¥${fmt(pnl,2)}</div></div>
    <div class="stat-card"><div class="label">📈 总收益率</div><div class="value ${colorNum(tv/100000-1)}">${pct((tv/100000-1)*100)}</div></div>
  `;

  // 持仓
  const hl = document.getElementById('holdings-list');
  if((G.sim.holdings||[]).length === 0) {
    hl.innerHTML = '<p style="color:var(--text-dim);">暂无持仓，等待入场信号</p>';
  } else {
    hl.innerHTML = G.sim.holdings.map(h => {
      const etf = G.etfs?.find(e => e.code === h.etf);
      const cv = etf ? h.shares * etf.nav : 0;
      const hpnl = cv - h.shares * h.cost;
      return `<div class="action-item">
        <div class="act-icon">📦</div>
        <div class="act-info"><div class="act-name">${etf?.name||h.etf}</div><div class="act-reason">${h.shares}份 · 成本 ¥${fmt(h.cost,4)} · 现价 ¥${etf?fmt(etf.nav,4):'--'}</div></div>
        <div class="act-badge ${hpnl>=0?'buy':'sell'}">${pct(hpnl/h.shares/h.cost*100)}</div>
      </div>`;
    }).join('');
  }

  // 交易记录
  const tl = document.getElementById('trades-list');
  if((G.sim.trades||[]).length === 0) {
    tl.innerHTML = '<p style="color:var(--text-dim);">暂无交易记录</p>';
  } else {
    tl.innerHTML = G.sim.trades.slice(-20).reverse().map(t => {
      const emoji = { buy: '🟢', sell: '🔴', hold: '🟡' };
      return `<div class="news-item">
        <span style="font-size:12px;color:var(--text-dim)">${t.date}</span>
        <strong style="margin:0 8px;">${emoji[t.action]||''} ${t.action}</strong>
        ${t.etf} × ${t.shares}份 @¥${fmt(t.price,4)}
        ${t.reason ? `<div style="font-size:12px;color:var(--text-dim);margin-top:2px">${t.reason}</div>` : ''}
      </div>`;
    }).join('');
  }

  // 纠偏记录
  const cl = document.getElementById('corrections-list');
  if((G.sim.corrections||[]).length === 0) {
    cl.innerHTML = '<p style="color:var(--text-dim);">暂无纠偏记录 — 策略运行正常</p>';
  } else {
    cl.innerHTML = G.sim.corrections.slice(-10).reverse().map(c => `
      <div class="news-item">
        <span style="font-size:12px;color:var(--warn)">🔧 ${c.date}</span>
        <span style="margin-left:8px;">${c.reason}</span>
        ${c.action ? `<span class="badge" style="margin-left:8px;background:rgba(245,158,11,.15);color:var(--warn)">${c.action}</span>` : ''}
      </div>
    `).join('');
  }

  // 净值走势图
  if(G.sim.snapshots && G.sim.snapshots.length > 0) {
    const ctx = document.getElementById('simChart');
    if(G.charts.simChart) G.charts.simChart.destroy();
    const snaps = G.sim.snapshots;
    const labels = snaps.map(s => s.date.slice(5));
    const data = snaps.map(s => s.totalValue);
    G.charts.simChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [
        { label: '组合净值', data, borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(59,130,246,.1)', tension: 0.3 },
        { label: '基准(100k)', data: new Array(snaps.length).fill(100000), borderColor: '#6b7280', borderWidth: 1, borderDash: [5,5], pointRadius: 0, fill: false }
      ]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#6b7280', boxWidth: 12 } } }, scales: { x: { ticks: { maxTicksLimit: 10, color: '#6b7280' }, grid: { color: '#1e2a3a' } }, y: { ticks: { color: '#6b7280' }, grid: { color: '#1e2a3a' } } } }
    });
  }
}

// ===== 新闻 =====
function renderNews() {
  if(!G.news) return;
  document.getElementById('news-loading').style.display = 'none';
  document.getElementById('news-content').style.display = 'block';
  const nl = document.getElementById('news-list');
  if(G.news.length === 0) {
    nl.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px;">暂无新闻数据</p>';
  } else {
    nl.innerHTML = G.news.map(n => `
      <div class="news-item">
        <a href="${n.url}" target="_blank" rel="noopener">${n.title}</a>
        ${n.summary ? `<div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${n.summary}</div>` : ''}
        <div class="meta"><span>${n.source}</span><span>${n.time}</span></div>
      </div>
    `).join('');
  }
}

// ===== 投资建议 =====
function renderAdvice() {
  if(!G.advice) return;
  document.getElementById('advice-loading').style.display = 'none';
  document.getElementById('advice-content').style.display = 'block';
  const a = G.advice;

  const statusEmoji = { bullish:'🟢', bearish:'🔴', neutral:'🟡' };
  const riskClass = a.riskLevel === '低' ? 'risk-low' : a.riskLevel === '中等' ? 'risk-mid' : 'risk-high';

  document.getElementById('advice-main').innerHTML = `
    <div class="advice-box">
      <div class="level">${a.date || '--'} · 市场状态 <span class="badge ${a.marketStatus}">${statusEmoji[a.marketStatus]||''} ${a.marketStatus}</span> · 风险等级 <strong class="${riskClass}">${a.riskLevel || '--'}</strong></div>
      <div class="summary">${a.summary || '暂无'}</div>
      ${(a.actions||[]).map(act => `
        <div class="action-item">
          <div class="act-icon">📊</div>
          <div class="act-info"><div class="act-name">${act.name} · ¥${fmt(act.nav,4)}</div><div class="act-reason">${act.reason}</div></div>
          <div class="act-badge ${act.action.includes('关注')?'buy':act.action.includes('减')?'sell':act.action.includes('持有')?'hold':'wait'}">${act.action}</div>
        </div>
      `).join('')}
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>📋 详细说明</h3>
      <div style="margin-top:12px;">${(a.notes||['暂无']).map(n => `<div class="insight neutral" style="margin-bottom:6px;">${n}</div>`).join('')}</div>
    </div>
    ${(G.advice.simPortfolio) ? `
    <div class="card" style="margin-top:16px;">
      <h3>📊 模拟组合状态</h3>
      <div class="portfolio-summary" style="margin-top:12px;">
        <div class="stat-card"><div class="label">总资产</div><div class="value">¥${fmt(G.advice.simPortfolio.totalValue)}</div></div>
        <div class="stat-card"><div class="label">现金</div><div class="value">¥${fmt(G.advice.simPortfolio.cash)}</div></div>
        <div class="stat-card"><div class="label">持仓市值</div><div class="value">¥${fmt(G.advice.simPortfolio.holdingsValue)}</div></div>
        <div class="stat-card"><div class="label">盈亏</div><div class="value ${colorNum(G.advice.simPortfolio.pnlPct)}">${pct(G.advice.simPortfolio.pnlPct)}</div></div>
      </div>
    </div>
    ` : ''}
  `;
}

// ===== 初始化 =====
async function init() {
  const ok = await loadData();
  if(ok) {
    renderDashboard();
    // 预渲染各页面数据但不显示
    if(G.etfs) { activeETF = G.etfs[0]?.code; }
  } else {
    document.getElementById('dashboard-loading').textContent = '⚠️ 数据加载失败，请稍后刷新';
  }
}

init();
</script>

</body>
</html>
